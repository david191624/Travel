<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK Live Bus Arrivals (KMB & CTB)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Map overriding */
        #map {
            height: 250px;
            width: 100%;
            z-index: 10;
            border-radius: 0.75rem;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .pulse-dot {
            width: 14px;
            height: 14px;
            background-color: #3b82f6; /* Blue for User */
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-animation 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
            border: 2px solid white;
        }

        @keyframes pulse-animation {
            to { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- App Header -->
    <header class="bg-gradient-to-r from-red-600 to-yellow-500 text-white p-4 shadow-md sticky top-0 z-20">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="bus" class="w-6 h-6"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide leading-tight">HK Bus Live</h1>
                    <p class="text-[10px] text-white opacity-90 font-medium">KMB & Citybus via Data.gov.hk</p>
                </div>
            </div>
            <button id="refreshBtn" class="p-2 bg-black bg-opacity-20 hover:bg-opacity-30 rounded-full transition-colors hidden">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col max-w-3xl mx-auto w-full p-4 relative" id="appContent">
        
        <!-- INITIAL STATE -->
        <div id="initialState" class="flex flex-col items-center justify-center flex-grow text-center fade-in mt-12">
            <div class="bg-blue-100 p-6 rounded-full mb-6 text-blue-600">
                <i data-lucide="map-pin" class="w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-gray-800">Find KMB & CTB Stops</h2>
            <p class="text-gray-500 mb-8 max-w-sm text-sm">Allow location access to get real-time ETAs for both Kowloon Motor Bus and Citybus.</p>
            <button id="locateBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-8 rounded-full shadow-lg transition-transform transform active:scale-95 flex items-center gap-2 text-lg">
                <i data-lucide="navigation"></i>
                Locate Me
            </button>
            <div id="locationError" class="text-red-500 mt-4 text-sm hidden font-medium bg-red-50 p-3 rounded-lg border border-red-100"></div>
        </div>

        <!-- LOADING STATE -->
        <div id="loadingState" class="hidden flex-col items-center justify-center flex-grow text-center fade-in mt-12">
            <div class="relative w-20 h-20 mb-6">
                <div class="absolute inset-0 border-4 border-gray-200 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
                <i data-lucide="download-cloud" class="absolute inset-0 m-auto w-8 h-8 text-blue-600"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800" id="loadingText">Fetching HK Data...</h2>
            <p class="text-gray-500 mt-2 text-sm" id="loadingSubText">Connecting to Data.gov.hk</p>
        </div>

        <!-- RESULTS STATE -->
        <div id="resultsState" class="hidden flex-col gap-4 fade-in pb-20">
            <!-- Map Container -->
            <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-200">
                <div id="map"></div>
                <div class="flex items-center justify-center gap-4 mt-2 px-2 text-[11px] text-gray-600 font-medium">
                    <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-blue-500 border border-white"></div> You</div>
                    <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-red-500 border border-white"></div> KMB/LWB</div>
                    <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-full bg-yellow-400 border border-white"></div> Citybus</div>
                </div>
            </div>

            <!-- Stops List Header -->
            <div class="flex justify-between items-end px-1 mt-2">
                <h3 class="font-bold text-lg text-gray-800">Nearby Stops</h3>
                <span id="stopCount" class="text-sm text-gray-500 font-medium"></span>
            </div>

            <!-- Stops List Container -->
            <div id="stopsList" class="flex flex-col gap-3"></div>
        </div>
    </main>

    <!-- ETA MODAL -->
    <div id="arrivalsModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex-col justify-end backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full rounded-t-3xl p-5 shadow-2xl max-h-[85vh] flex flex-col slide-up relative">
            <button id="closeModalBtn" class="absolute top-4 right-4 p-2 bg-gray-100 rounded-full text-gray-600 hover:bg-gray-200">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="mb-5 pr-10">
                <div class="flex items-center gap-2 mb-1">
                    <span id="modalAgencyBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">AGENCY</span>
                </div>
                <h3 class="text-xl font-bold text-gray-800 leading-tight" id="modalStopNameEn">Stop Name</h3>
                <h4 class="text-md text-gray-500 font-medium mt-0.5" id="modalStopNameTc">站名</h4>
                
                <div class="flex items-center gap-2 text-green-600 text-xs mt-2 font-semibold bg-green-50 w-max px-2 py-1 rounded-md">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    Live Data Active
                </div>
            </div>

            <div id="arrivalsList" class="overflow-y-auto flex flex-col gap-3 pb-6">
                <!-- Arrival items injected here -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        lucide.createIcons();

        let userLocation = null;
        let kmbStopsData = null;
        let ctbStopsData = null;
        let nearbyStops = [];
        let map = null;
        let userMarker = null;
        let stopMarkers = [];

        const UI = {
            initial: document.getElementById('initialState'),
            loading: document.getElementById('loadingState'),
            results: document.getElementById('resultsState'),
            locateBtn: document.getElementById('locateBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            error: document.getElementById('locationError'),
            loadingText: document.getElementById('loadingText'),
            loadingSubText: document.getElementById('loadingSubText'),
            stopsList: document.getElementById('stopsList'),
            stopCount: document.getElementById('stopCount'),
            modal: document.getElementById('arrivalsModal'),
            closeModal: document.getElementById('closeModalBtn'),
            modalAgencyBadge: document.getElementById('modalAgencyBadge'),
            modalNameEn: document.getElementById('modalStopNameEn'),
            modalNameTc: document.getElementById('modalStopNameTc'),
            arrivalsList: document.getElementById('arrivalsList')
        };

        UI.locateBtn.addEventListener('click', initFlow);
        UI.refreshBtn.addEventListener('click', initFlow);
        UI.closeModal.addEventListener('click', () => UI.modal.classList.add('hidden'));
        UI.modal.addEventListener('click', (e) => {
            if (e.target === UI.modal) UI.modal.classList.add('hidden');
        });

        async function initFlow() {
            showLoading("Finding your location...", "Accessing GPS");
            
            if (!navigator.geolocation) {
                showError("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
                    await processHKData();
                },
                (error) => {
                    showError("Location access denied or unavailable.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        async function processHKData() {
            try {
                showLoading("Downloading Databases...", "Syncing with KMB & CTB");

                let fetchPromises = [];

                // Fetch KMB Database if not cached
                if (!kmbStopsData) {
                    fetchPromises.push(
                        fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop')
                        .then(res => res.json())
                        .then(data => { kmbStopsData = data.data.map(s => ({...s, agency: 'kmb'})); })
                        .catch(err => console.error("KMB API Error", err))
                    );
                }

                // Fetch CTB Database if not cached
                if (!ctbStopsData) {
                    fetchPromises.push(
                        fetch('https://rt.data.gov.hk/v2/transport/citybus/stop')
                        .then(res => res.json())
                        .then(data => { ctbStopsData = data.data.map(s => ({...s, agency: 'ctb'})); })
                        .catch(err => console.error("CTB API Error", err))
                    );
                }

                // Wait for both to finish (Promise.allSettled prevents one failure from breaking the whole app)
                await Promise.allSettled(fetchPromises);

                const allStops = [...(kmbStopsData || []), ...(ctbStopsData || [])];

                if (allStops.length === 0) {
                    throw new Error("Could not load any bus stops from Data.gov.hk.");
                }

                showLoading("Calculating distances...", "Finding stops within 500m");

                // Filter stops by distance
                nearbyStops = [];
                for (let stop of allStops) {
                    // Note: KMB uses `long`, CTB uses `long` or `longitude`. Safely parse both.
                    const stopLon = stop.long || stop.longitude;
                    const dist = calculateDistance(userLocation.lat, userLocation.lon, parseFloat(stop.lat), parseFloat(stopLon));
                    if (dist <= 500) {
                        nearbyStops.push({ ...stop, distance: Math.round(dist) });
                    }
                }

                nearbyStops.sort((a, b) => a.distance - b.distance);

                if (nearbyStops.length === 0) {
                    showError("You don't appear to be near any bus routes in Hong Kong (or no stops within 500m).");
                    return;
                }

                renderStops();

            } catch (error) {
                console.error(error);
                showError("Failed to connect to HK Government Data APIs. Please try again later.");
            }
        }

        function renderStops() {
            UI.loading.classList.add('hidden');
            UI.loading.classList.remove('flex');
            UI.results.classList.remove('hidden');
            UI.results.classList.add('flex');
            UI.refreshBtn.classList.remove('hidden');

            UI.stopCount.innerText = `${nearbyStops.length} stops nearby`;
            UI.stopsList.innerHTML = '';
            
            nearbyStops.forEach(stop => {
                const isKmb = stop.agency === 'kmb';
                const badgeColor = isKmb ? 'bg-red-600 text-white' : 'bg-yellow-400 text-blue-900';
                const badgeText = isKmb ? 'KMB / LWB' : 'Citybus';
                const iconColor = isKmb ? 'text-red-600' : 'text-yellow-600';
                const iconBg = isKmb ? 'bg-red-50' : 'bg-yellow-50';

                const el = document.createElement('div');
                el.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:shadow-md transition-shadow active:bg-gray-50";
                el.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden w-full">
                        <div class="${iconBg} p-2.5 rounded-full ${iconColor} flex-shrink-0">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex-grow">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="${badgeColor} text-[9px] font-bold px-1.5 py-0.5 rounded-sm uppercase">${badgeText}</span>
                            </div>
                            <h4 class="font-bold text-gray-800 truncate text-base leading-tight">${stop.name_en}</h4>
                            <h5 class="text-xs text-gray-500 font-medium truncate">${stop.name_tc}</h5>
                            <div class="flex items-center text-xs text-gray-500 font-semibold gap-1 mt-1">
                                <i data-lucide="footprints" class="w-3 h-3"></i> ${stop.distance}m away
                            </div>
                        </div>
                        <div class="text-gray-300 pl-2">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </div>
                    </div>
                `;
                el.addEventListener('click', () => openLiveETA(stop));
                UI.stopsList.appendChild(el);
            });
            
            lucide.createIcons();
            updateMap();
        }

        async function openLiveETA(stop) {
            const isKmb = stop.agency === 'kmb';
            
            // Set up Modal Header styling based on agency
            UI.modalAgencyBadge.className = `text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ${isKmb ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-800'}`;
            UI.modalAgencyBadge.innerText = isKmb ? 'KMB / LWB' : 'Citybus (CTB)';
            
            UI.modalNameEn.innerText = stop.name_en;
            UI.modalNameTc.innerText = stop.name_tc;
            
            UI.arrivalsList.innerHTML = `
                <div class="flex flex-col items-center justify-center p-8 text-blue-600 gap-3">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin"></i>
                    <span class="text-sm font-medium">Fetching Live Data...</span>
                </div>
            `;
            lucide.createIcons();
            
            UI.modal.classList.remove('hidden');
            UI.modal.classList.add('flex');

            try {
                let apiUrl = '';
                if (isKmb) {
                    apiUrl = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.stop}`;
                } else {
                    apiUrl = `https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stop.stop}`;
                }

                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("ETA API responded with error.");
                const json = await res.json();
                
                // Filter out entries with no ETA string (buses not scheduled)
                const validEtas = json.data.filter(item => item.eta !== null && item.eta !== "");
                
                // Group by Route & Destination
                const routesMap = {};
                const now = new Date();

                validEtas.forEach(etaObj => {
                    const routeKey = `${etaObj.route}-${etaObj.dir}-${etaObj.dest_en}`;
                    if (!routesMap[routeKey]) {
                        routesMap[routeKey] = {
                            route: etaObj.route,
                            dest_en: etaObj.dest_en,
                            dest_tc: etaObj.dest_tc,
                            times: [],
                            agency: stop.agency
                        };
                    }
                    
                    const etaTime = new Date(etaObj.eta);
                    let mins = Math.floor((etaTime - now) / 60000);
                    if (mins < 0) mins = 0;
                    
                    routesMap[routeKey].times.push(mins);
                });

                // Convert map to array and sort by soonest arrival
                const routeList = Object.values(routesMap).map(r => {
                    r.times.sort((a,b) => a - b);
                    return r;
                }).sort((a, b) => a.times[0] - b.times[0]);

                renderETAs(routeList);

            } catch (err) {
                console.error(err);
                UI.arrivalsList.innerHTML = `<div class="p-4 text-center text-red-500 bg-red-50 rounded-lg">Failed to load real-time data for this stop.</div>`;
            }
        }

        function renderETAs(routes) {
            UI.arrivalsList.innerHTML = '';
            
            if (routes.length === 0) {
                UI.arrivalsList.innerHTML = `
                    <div class="p-8 flex flex-col items-center text-center text-gray-400 bg-gray-50 rounded-xl border border-gray-100">
                        <i data-lucide="moon" class="w-8 h-8 mb-2 opacity-50"></i>
                        <p class="font-medium">No upcoming buses scheduled.</p>
                        <p class="text-xs mt-1">Service may have ended for the day.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            routes.forEach(route => {
                const el = document.createElement('div');
                el.className = "flex flex-col bg-white p-3 rounded-lg border border-gray-200 shadow-sm";
                
                const timeBadges = route.times.slice(0, 3).map((mins, idx) => {
                    if (mins === 0) return `<span class="text-red-600 font-bold text-lg animate-pulse">Due</span>`;
                    const style = idx === 0 ? "text-gray-800 font-bold text-lg" : "text-gray-500 font-medium text-sm";
                    return `<span class="${style}">${mins}<span class="
