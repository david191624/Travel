    // 用戶自定義的 Gemini API Key (可選，留空會跑失敗提示，填入真實金鑰即可啟用)
    const getApiKey = () => ""; 

    async function fetchWithBackoff(url, options, maxRetries = 3) {
      let delay = 1000;
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (response.ok) return response;
          if (response.status === 429 || response.status >= 500) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          return response;
        } catch (err) {
          if (i === maxRetries - 1) throw err;
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }
    }

    // 文字生文字含 Google 搜尋 (Gemini 3 Flash)
    async function callGeminiTextWithSearch(promptQuery) {
      const apiKey = getApiKey();
      if (!apiKey) return { text: "⚠️ 尚未設定 Gemini API Key。請在程式碼 `getApiKey()` 函式中填入您的金鑰即可啟用 AI 聯網查詢功能。", sources: [] };
      
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      const systemPrompt = "Act as an expert, warm, Cantonese/Traditional Chinese speaking Europe trip concierge for C and D traveling through Netherlands, Belgium, France, and Switzerland. Provide clear, well-formatted, and helpful travel advice with real-time accuracy.";
      
      const payload = {
        contents: [{ parts: [{ text: promptQuery }] }],
        tools: [{ "google_search": {} }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      try {
        const res = await fetchWithBackoff(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        const candidate = result.candidates?.[0];
        const text = candidate?.content?.parts?.[0]?.text || "抱歉，Gemini API 暫時未有傳回解答。";
        
        let sources = [];
        const groundingMetadata = candidate?.groundingMetadata;
        if (groundingMetadata && groundingMetadata.groundingAttributions) {
          sources = groundingMetadata.groundingAttributions
            .map(attr => ({ uri: attr.web?.uri, title: attr.web?.title }))
            .filter(s => s.uri && s.title);
        }
        return { text, sources };
      } catch (err) {
        return { text: "發生錯誤，無法連結 Gemini AI，請確認網路或 API Key。", sources: [] };
      }
    }

    function pcmToWavBlob(pcmInt16Array, sampleRate = 24000) {
      const buffer = new ArrayBuffer(44 + pcmInt16Array.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + pcmInt16Array.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // Mono PCM
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcmInt16Array.length * 2, true);
      let offset = 44;
      for (let i = 0; i < pcmInt16Array.length; i++, offset += 2) {
        view.setInt16(offset, pcmInt16Array[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    }

        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      const part = result?.candidates?.[0]?.content?.parts?.[0];
      const audioData = part?.inlineData?.data;
      if (audioData) {
        const binaryString = window.atob(audioData);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const pcm16 = new Int16Array(bytes.buffer);
        const wavBlob = pcmToWavBlob(pcm16, 24000);
        return URL.createObjectURL(wavBlob);
      } else {
        throw new Error("無法生成語音檔");
      }
    }

                      onClick={() => handleAskAI("請為 Day 7 巴黎行程提供雨天備案與室內藝術館替代方案")}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-purple-300 px-3 py-2 rounded-xl"
                    >
                      🌧️ 巴黎/羊角村雨天備案建議
                    </button>
                    <button
                      onClick={() => handleAskAI("請列出在荷蘭與法國巴黎最常用的 5 句點餐問路法語/荷蘭語對照")}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-emerald-300 px-3 py-2 rounded-xl"
                    >
                      🗣️ 點餐問路法文與荷蘭文
                    </button>
                    <button
                      onClick={() => handleAskAI("少女峰觀景台高山症應變注意事項與防寒穿搭")}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-amber-300 px-3 py-2 rounded-xl"
                    >
                      🏔️ 少女峰高山防寒與安全指南
                    </button>
                  </div>
                </div>

                {/* 輸入框 */}
                <div className="bg-slate-800/90 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-xl">
                  <textarea
                    rows="3"
                    placeholder="輸入任何有關歐洲行程、交通、退稅、美食或語言的問題..."
                    value={aiQuery}
                    onChange={(e) => setAiQuery(e.target.value)}
                    className="w-full bg-slate-900 text-white text-sm rounded-xl p-3 border border-slate-700 focus:outline-none focus:border-purple-500"
                  />
                  <div className="flex justify-between items-center">
                    <span className="text-xs text-slate-400">✨ 自動使用 Google 地圖與即時搜尋技術驗證</span>
                    <button
                      disabled={aiLoading}
                      onClick={() => handleAskAI()}
                      className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-lg transition-all"
                    >
                      {aiLoading ? "Gemini 正在搜尋解答..." : "發問 Gemini AI"}
                    </button>
                  </div>
                </div>

                {/* AI 回答渲染 */}
                {aiResponse && (
                  <div className="bg-slate-900/90 border border-purple-500/40 p-6 rounded-2xl space-y-4 shadow-2xl">
                    <h3 className="text-lg font-bold text-purple-300 border-b border-slate-800 pb-2">💡 Gemini AI 管家解答：</h3>
                    <div className="text-sm text-slate-200 leading-relaxed whitespace-pre-line">
                      {aiResponse.text}
                    </div>

                    {/* Grounding 參考來源 */}
                    {aiResponse.sources && aiResponse.sources.length > 0 && (
                      <div className="pt-3 border-t border-slate-800 space-y-2">
                        <span className="text-xs font-bold text-slate-400 block">🌐 參考即時搜尋來源：</span>
                        <div className="flex flex-wrap gap-2">
                          {aiResponse.sources.map((s, idx) => (
                            <a
                              key={idx}
                              href={s.uri}
                              target="_blank"
                              className="text-xs text-indigo-400 hover:underline bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700"
                            >
                              🔗 {s.title || s.uri}
                            </a>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* 一鍵語音朗讀回答 */}
                    <div className="pt-2">
                      <button
                        disabled={ttsLoading}
                        onClick={() => handleSpeakText(aiResponse.text.slice(0, 200))}
                        className="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-3 py-1.5 rounded-lg font-bold hover:bg-purple-900"
                      >
                        🔊 語音朗讀這段摘要 (Gemini TTS)
                      </button>
                    </div>
                  </div>
                )}

                {/* 當地實用語音 */}
                <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 space-y-4">
                  <h3 className="text-lg font-bold text-white border-b border-slate-700 pb-2">🗣️ 當地實用對話 AI 真人朗讀幫手 (Gemini TTS)</h3>
                  <p className="text-xs text-slate-300">點擊以下句子，AI 會發出標準當地語言發音：</p>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <button onClick={() => handleSpeakText("Bonjour, une table pour deux s'il vous plaît", "Kore")} className="bg-slate-900 hover:bg-slate-950 p-3 rounded-xl border border-slate-700 text-left text-xs space-y-1">
                      <strong className="text-amber-300 block">🇫🇷 法國巴黎點餐</strong>
                      <span className="text-white block font-mono">"Bonjour, une table pour deux s'il vous plaît."</span>
                      <span className="text-slate-400">(你好，請給我一張兩位檯)</span>
                    </button>
                    <button onClick={() => handleSpeakText("Een biertje alstublieft", "Puck")} className="bg-slate-900 hover:bg-slate-950 p-3 rounded-xl border border-slate-700 text-left text-xs space-y-1">
                      <strong className="text-emerald-300 block">🇳🇱 荷蘭/比利時點啤酒</strong>
                      <span className="text-white block font-mono">"Een biertje alstublieft."</span>
                      <span className="text-slate-400">(請給我一杯啤酒，謝謝)</span>
                    </button>
                    <button onClick={() => handleSpeakText("Grüezi, wo ist die Toilette bitte?", "Zephyr")} className="bg-slate-900 hover:bg-slate-950 p-3 rounded-xl border border-slate-700 text-left text-xs space-y-1">
                      <strong className="text-sky-300 block">🇨🇭 瑞士問洗手間</strong>
                      <span className="text-white block font-mono">"Grüezi, wo ist die Toilette bitte?"</span>
                      <span className="text-slate-400">(你好，請問洗手間在哪裡？)</span>
                    </button>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 3: 當地美食 */}
            {activeTab === 'food' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-orange-950/60 to-slate-900 p-5 rounded-2xl border border-orange-500/40">
                  <h2 className="text-xl font-bold text-white">🍱 歐洲 4 國美食地圖與必吃街頭小吃</h2>
                </div>
                <div className="space-y-8">
                  {LOCAL_FOOD_GUIDE.map((cg, idx) => (
                    <div key={idx} className="space-y-4">
                      <h3 className="text-lg font-bold text-amber-300 border-b border-slate-800 pb-2">{cg.country}</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {cg.foodItems.map((f, fIdx) => (
                          <div key={fIdx} className="bg-slate-800/90 border border-slate-700 rounded-2xl overflow-hidden shadow-lg space-y-0 flex flex-col justify-between">
                            <div className="h-48 w-full overflow-hidden">
                              <img src={f.img} alt="" className="w-full h-full object-cover" />
                            </div>
                            <div className="p-5 space-y-3">
                              <div className="flex justify-between items-center">
                                <span className="font-bold text-white text-lg">{f.name}</span>
                                <span className="text-emerald-400 font-mono text-base font-bold bg-slate-900 px-3 py-1 rounded-lg border border-slate-700">{f.price}</span>
                              </div>
                              <p className="text-sm text-slate-300 leading-relaxed">{f.desc}</p>
                              <div className="text-xs text-amber-200 bg-slate-900 p-3 rounded-xl border border-slate-800">📍 推薦打卡餐廳：{f.recommend}</div>
                              <a
                                href={getGoogleMapUrl(`${f.name} ${f.recommend}`)}
                                target="_blank"
                                className="inline-flex items-center gap-1.5 text-xs font-bold text-orange-400 bg-orange-950/80 px-3.5 py-2 rounded-xl border border-orange-800 w-full justify-center"
                              >
                                📍 Google Maps 尋找此美食店家
                              </a>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: 天氣預報 */}
            {activeTab === 'weather' && (
              <div className="space-y-6">
                <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
                  <h2 className="text-xl font-bold text-white">☀️ 5 大停留城市 7 天天氣圖鑑預報</h2>
                  <p className="text-xs text-slate-400 mt-1">即時連線未來 7 天降雨機率與高低溫，幫您輕鬆安排晴天戶外與雨天室內行程。</p>
                </div>

                <div className="space-y-6">
                  {CITIES.map((c) => {
                    const w = weatherData[c.id] || FALLBACK_WEATHER[c.id];
                    return (
                      <div key={c.id} className="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 space-y-4 shadow-lg">
                        <div className="flex flex-wrap items-center justify-between border-b border-slate-700 pb-3">
                          <div>
                            <span className="text-xs text-indigo-400 font-bold">{c.country}</span>
                            <h3 className="text-xl font-bold text-white">{c.name}</h3>
                          </div>
                          <div className="text-2xl font-extrabold text-amber-400">目前：{w.temp}°C</div>
                        </div>

                        {w.daily ? (
                          <div className="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3 pt-2">
                            {w.daily.map((dayItem, dIdx) => (
                              <div key={dIdx} className="bg-slate-900/90 p-3 rounded-xl border border-slate-700/80 text-center space-y-1.5">
                                <span className="text-xs text-slate-400 font-bold block">{dayItem.date}</span>
                                <span className="text-base font-bold block">{dayItem.weatherIcon}</span>
                                <span className="text-xs font-bold text-slate-200 block">{dayItem.min}°C ~ {dayItem.max}°C</span>
                                <span className={`text-[11px] px-2 py-0.5 rounded-full font-bold inline-block ${dayItem.rainProb > 40 ? 'bg-sky-950 text-sky-300 border border-sky-700' : 'text-slate-400'}`}>
                                  ☔ {dayItem.rainProb}%
                                </span>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="text-sm text-slate-400">正在獲取 7 天天氣資料...</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 5: 交通攻略 */}
            {activeTab === 'transits' && (
              <div className="space-y-6">
                <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
                  <h2 className="text-xl font-bold text-white">🚆 跨國與鐵路接駁全攻略</h2>
                </div>
                
                {/* 跨國高鐵提示 */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-sm text-slate-200">
                  <div className="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl space-y-3 shadow-lg">
                    <strong className="text-indigo-300 text-lg block">🇳🇱 荷蘭 & 🇧🇪 比利時</strong>
                    <p>• 荷蘭大眾運輸支援 <strong>OVpay</strong>，使用 Apple Pay 或信用卡直接感應進出站。</p>
                    <p>• 阿姆斯特丹往布魯塞爾可搭 Eurostar 高鐵 (需劃位) 或 EuroCity Direct。</p>
                    <p>• 週末搭比利時國鐵可買 <strong>Weekend Ticket</strong> (5折優惠)。</p>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700 p-6 rounded-2xl space-y-3 shadow-lg">
                    <strong className="text-emerald-300 text-lg block">🇫🇷 法國 & 🇨🇭 瑞士</strong>
                    <p>• 巴黎前往瑞士搭乘 <strong>TGV Lyria</strong> 高鐵 ( Paris Gare de Lyon ➔ Basel SBB)。</p>
                    <p>• 前往格林德瓦搭 BOB 列車時，認明車廂外「Grindelwald」標示（於半路分拆）。</p>
                    <p>• Grindelwald Terminal 搭乘最新 <strong>Eiger Express</strong> 3S 纜車 15 分鐘直達冰川站。</p>
                  </div>
                </div>

                {/* 各國套票 */}
                <div className="space-y-8 pt-4">
                  {PASSES_GUIDE.map((countryGroup, cIdx) => (
                    <div key={cIdx} className="space-y-4">
                      <h3 className="text-xl font-extrabold text-amber-300 border-b border-slate-800 pb-2">
                        {countryGroup.country}
                      </h3>

                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {countryGroup.passes.map((pass, pIdx) => (
                          <div key={pIdx} className="bg-slate-800/90 border border-slate-700 hover:border-emerald-500/60 rounded-2xl p-6 flex flex-col justify-between space-y-4 shadow-xl transition-all">
                            <div className="space-y-3">
                              <div className="flex flex-wrap items-center justify-between gap-2">
                                <span className="bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 text-xs font-bold px-3 py-1 rounded-full">
                                  {pass.type}
                                </span>
                                <span className="text-xs font-mono font-bold text-amber-300 bg-slate-900 px-3 py-1 rounded-lg border border-slate-700">
                                  {pass.shareType}
                                </span>
                              </div>
                              <h4 className="text-xl font-extrabold text-white">{pass.name}</h4>
                              <div className="bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 text-sm font-bold text-emerald-400">
                                💰 價格與方案：{pass.price}
                              </div>
                              <p className="text-sm text-slate-200 leading-relaxed">
                                🗺️ <strong>適用範圍：</strong> {pass.coverage}
                              </p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 6: APPS */}
            {activeTab === 'apps' && (
              <div className="space-y-6">
                <div className="bg-slate-800/80 p-5 rounded-2xl border border-slate-700">
                  <h2 className="text-xl font-bold text-white">📱 當地 App & 票券預訂官網</h2>
                </div>
                <div className="space-y-8">
                  {TRAVEL_APPS_HUB.map((group, idx) => (
                    <div key={idx} className="space-y-4">
                      <h3 className="text-base font-bold text-indigo-300">{group.country}</h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {group.apps.map((app, aIdx) => (
                          <div key={aIdx} className="bg-slate-800/90 border border-slate-700 p-5 rounded-2xl space-y-3 shadow-lg">
                            <span className="text-xs bg-sky-500/20 text-sky-300 px-3 py-1 rounded-full border border-sky-500/30 font-bold">{app.badge}</span>
                            <h4 className="font-bold text-white text-base">{app.name}</h4>
                            <p className="text-sm text-slate-300">{app.desc}</p>
                            <a href={app.link} target="_blank" className="text-sm text-indigo-400 font-bold inline-block pt-1">🔗 前往官方網站 ➔</a>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          <footer className="max-w-7xl mx-auto px-4 mt-12 pt-6 border-t border-slate-800 text-center text-sm text-slate-400">
            歐洲 12 日跨國之旅助手 • 單檔完美整合版 • 祝 C & D 旅途愉快！
          </footer>
        </div>
      );
    }

    // 將 App 掛載到 root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
